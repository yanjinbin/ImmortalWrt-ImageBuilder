name: Build 25.12.x Rockchip
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      profile:
        type: choice
        description: |
          输入 软路由型号 可选值如下：
        options:
          - linkease_easepi-r1
          - 9tripod_x3568-v4
          - ariaboard_photonicat
          - ariaboard_photonicat2
          - armsom_sige3
          - armsom_sige7
          - cyber_cyber3588-aib
          - ezpro_mrkaio-m68s
          - firefly_roc-rk3328-cc
          - firefly_roc-rk3568-pc
          - friendlyarm_nanopc-t4
          - friendlyarm_nanopc-t6
          - friendlyarm_nanopi-r2c
          - friendlyarm_nanopi-r2c-plus
          - friendlyarm_nanopi-r2s
          - friendlyarm_nanopi-r3s
          - friendlyarm_nanopi-r4s
          - friendlyarm_nanopi-r4se
          - friendlyarm_nanopi-r4s-enterprise
          - friendlyarm_nanopi-r5c
          - friendlyarm_nanopi-r5s
          - friendlyarm_nanopi-r6c
          - friendlyarm_nanopi-r6s
          - friendlyarm_nanopi-r76s
          - huake_guangmiao-g4c
          - lunzn_fastrhino-r66s
          - lunzn_fastrhino-r68s
          - lyt_t68m
          - mmbox_anas3035
          - nlnet_xiguapi-v3
          - pine64_rock64
          - pine64_rockpro64
          - radxa_cm3_io
          - radxa_e20c
          - radxa_e25
          - radxa_e52c
          - radxa_rock-2a
          - radxa_rock-2f
          - radxa_rock-3a
          - radxa_rock-3b
          - radxa_rock-3c
          - radxa_rock-4c-plus
          - radxa_rock-4d
          - radxa_rock-4se
          - radxa_rock-5a
          - radxa_rock-5b
          - radxa_rock-5b-plus
          - radxa_rock-5-itx
          - radxa_rock-5c
          - radxa_rock-5t
          - radxa_rock-pi-4a
          - radxa_rock-pi-e
          - radxa_rock-pi-s
          - radxa_zero-3e
          - radxa_zero-3w
          - sinovoip_bpi-r2-pro
          - widora_mangopi-m28c
          - widora_mangopi-m28k
          - xunlong_orangepi-5
          - xunlong_orangepi-5-plus
          - xunlong_orangepi-r1-plus
          - xunlong_orangepi-r1-plus-lts
        required: true
        default: 'friendlyarm_nanopi-r5c'
      custom_router_ip:
        description: "选择默认 LAN 口管理地址(仅对多网口软路由有效)"
        required: true
        type: choice
        default: "192.168.1.1"
        options:
          - "192.168.1.1"
          - "192.168.100.1"
          - "192.168.2.1"
          - "192.168.5.1"
          - "192.168.31.1"
          - "10.0.0.1"
      mihomo_version:
        description: "mihomo 版本 (默认 1.19.27, 可选 latest 最新版; 选 custom 时填写下方自定义版本)"
        required: true
        type: choice
        default: "1.19.27"
        options:
          - "1.19.27"
          - "latest"
          - "1.19.29"
          - "1.19.28"
          - "1.19.24"
          - "custom"
      mihomo_custom_version:
        description: "自定义 mihomo 版本号 (mihomo_version 选 custom 时填写, 例如 1.19.25)"
        required: false
        default: ""
      mihomo_platform:
        description: "mihomo 平台 (默认 arm64, 覆盖 R5C/R6S/E20C; 选 custom 时填写下方自定义平台)"
        required: true
        type: choice
        default: "arm64"
        options:
          - "arm64"
          - "amd64"
          - "amd64-v3"
          - "amd64-compatible"
          - "armv7"
          - "riscv64"
          - "386"
          - "custom"
      mihomo_custom_platform:
        description: "自定义 mihomo 平台 (选 custom 时填写, 对应 MetaCubeX releases 资产名如 mipsle-softfloat)"
        required: false
        default: ""
      rootfs_partsize:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false
      remark:
        description: "备注说明 (可选, 会写入本次 Release 说明)"
        required: false
        default: ""
      nikki_version:
        description: "OpenWrt-nikki 预编译 release: latest 或 release tag (如 prebuilt-aarch64-25.12-6b4e263)"
        required: false
        default: "latest"
      uniwrt_version:
        description: "uniwrt-luci 预编译 release: latest 或 release tag (如 prebuilt-aarch64-25.12-adef3c1)"
        required: false
        default: "latest"
      footstrap_version:
        description: "luci-theme-footstrap 预编译 release: latest 或 release tag (如 prebuilt-aarch64-25.12-eb24dd5)"
        required: false
        default: "latest"
      include_geox:
        description: "是否内置 geox 数据集 (geoip/geosite/mmdb)"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  # fork 插件不再在此仓库用 SDK 编译, 统一使用各 fork 仓库自己的 prebuilt release
  # (release 标签带 commit hash, 资产为固定名称的 tarball):
  #   yanjinbin/OpenWrt-nikki          -> nikki-aarch64_generic-openwrt-25.12.tar.gz
  #   yanjinbin/uniwrt-luci            -> luci-theme-uniwrt-aarch64_generic-openwrt-25.12.tar.gz
  #   yanjinbin/luci-theme-footstrap   -> luci-theme-footstrap-aarch64_generic-openwrt-25.12.tar.gz
  # 版本输入支持 latest 或指定 release tag; mihomo 由主 job 直接下载 MetaCubeX 预编译二进制
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/rockchip/build25.sh
      
      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的Rockchip软路由管理地址是:${{ github.event.inputs.custom_router_ip }}"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip
      
      - name: Validate PPPoE Inputs
        run: |
          enable_pppoe=$(jq -r '.inputs.enable_pppoe // ""' "$GITHUB_EVENT_PATH")
          pppoe_account=$(jq -r '.inputs.pppoe_account // ""' "$GITHUB_EVENT_PATH")
          pppoe_password=$(jq -r '.inputs.pppoe_password // ""' "$GITHUB_EVENT_PATH")
          if [[ "$enable_pppoe" == "yes" ]]; then
            if [[ -z "$pppoe_account" || -z "$pppoe_password" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: 下载 fork 插件预编译 release (latest 或指定版本)
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/fork-packages"

          fetch_release() {
            local repo="$1" version="$2" asset="$3" dest="$4"
            local url
            if [ "$version" = "latest" ]; then
              url="https://github.com/${repo}/releases/latest/download/${asset}"
            else
              url="https://github.com/${repo}/releases/download/${version}/${asset}"
            fi
            echo "下载: ${url}"
            curl -fL --retry 3 --retry-all-errors --connect-timeout 20 -o "/tmp/${dest}" "${url}"
            [ -s "/tmp/${dest}" ] || { echo "错误: ${asset} 下载失败"; exit 1; }
            mkdir -p "/tmp/${dest}.d"
            tar -xzf "/tmp/${dest}" -C "/tmp/${dest}.d"
            find "/tmp/${dest}.d" -type f -name '*.apk' -exec cp -v {} "${{ github.workspace }}/fork-packages/" \;
          }

          fetch_release yanjinbin/OpenWrt-nikki "${{ inputs.nikki_version }}" nikki-aarch64_generic-openwrt-25.12.tar.gz nikki.tar.gz
          fetch_release yanjinbin/uniwrt-luci "${{ inputs.uniwrt_version }}" luci-theme-uniwrt-aarch64_generic-openwrt-25.12.tar.gz uniwrt.tar.gz
          fetch_release yanjinbin/luci-theme-footstrap "${{ inputs.footstrap_version }}" luci-theme-footstrap-aarch64_generic-openwrt-25.12.tar.gz footstrap.tar.gz

          NIKKI_COMMIT="$(cat /tmp/nikki.tar.gz.d/commit.txt 2>/dev/null | cut -c1-7)"
          UNIWRT_COMMIT="$(cat /tmp/uniwrt.tar.gz.d/commit.txt 2>/dev/null | cut -c1-7)"
          FOOTSTRAP_COMMIT="$(cat /tmp/footstrap.tar.gz.d/commit.txt 2>/dev/null | cut -c1-7)"
          NIKKI_VER="$(find "${{ github.workspace }}/fork-packages" -maxdepth 1 -name 'nikki-*.apk' -exec basename {} \; 2>/dev/null | sed -nE 's/.*nikki-([^/]*)\.apk/\1/p' | head -1)"
          LUCI_NIKKI_VER="$(find "${{ github.workspace }}/fork-packages" -maxdepth 1 -name 'luci-app-nikki-*.apk' -exec basename {} \; 2>/dev/null | sed -nE 's/.*nikki-([^/]*)\.apk/\1/p' | head -1)"
          echo "NIKKI_COMMIT=${NIKKI_COMMIT:-latest}" >> "$GITHUB_ENV"
          echo "UNIWRT_COMMIT=${UNIWRT_COMMIT:-latest}" >> "$GITHUB_ENV"
          echo "FOOTSTRAP_COMMIT=${FOOTSTRAP_COMMIT:-latest}" >> "$GITHUB_ENV"
          echo "NIKKI_VER=${NIKKI_VER:-unknown}" >> "$GITHUB_ENV"
          echo "LUCI_NIKKI_VER=${LUCI_NIKKI_VER:-unknown}" >> "$GITHUB_ENV"
          echo "✅ nikki @ ${NIKKI_COMMIT:-latest} / uniwrt @ ${UNIWRT_COMMIT:-latest} / footstrap @ ${FOOTSTRAP_COMMIT:-latest}"
          ls -lah "${{ github.workspace }}/fork-packages/"

      - name: 下载 Bandix Plus 官方 APK
        run: |
          set -euo pipefail

          DEST="${{ github.workspace }}/fork-packages/bandix-plus"
          mkdir -p "$DEST"

          download_apk() {
            local url="$1"
            local output="$2"
            local sha256="$3"

            echo "下载: $url"
            curl -fL --retry 3 --retry-all-errors --connect-timeout 20 -o "$output" "$url"
            printf '%s  %s\n' "$sha256" "$output" | sha256sum -c -
          }

          # ImageBuilder 本地 APK 索引按「包名-版本.apk」取文件，不能保留 Release 的架构后缀。
          download_apk \
            "https://github.com/timsaya/openwrt-bandix-plus/releases/download/v0.1.2/bandix-plus-0.1.2-r1_aarch64_generic.apk" \
            "$DEST/bandix-plus-0.1.2-r1.apk" \
            "91b7d3f7a27788d5708c5d3d1b0a933a8bfbafec4a8f82fb59f0aaacb567c197"
          download_apk \
            "https://github.com/timsaya/luci-app-bandix-plus/releases/download/v0.1.3-r1/luci-app-bandix-plus-0.1.3-r1_all.apk" \
            "$DEST/luci-app-bandix-plus-0.1.3-r1.apk" \
            "d3af8ea19cbd7e15ed79f548404bd59f969bbeacc5abb391a3003b5cfe8691eb"
          download_apk \
            "https://github.com/timsaya/luci-app-bandix-plus/releases/download/v0.1.3-r1/luci-i18n-bandix-plus-zh-cn-26.211.58145.105dcec_all.apk" \
            "$DEST/luci-i18n-bandix-plus-zh-cn-26.211.58145~105dcec.apk" \
            "2d52caf4bcf6b8e87778a3d5cb35a47530892b10272a6554df30f67f8afa0ab3"

          echo "✅ 已导入 Bandix Plus 官方 APK:"
          ls -lah "$DEST"

      - name: 下载 mihomo 预编译二进制 (MetaCubeX releases, 不自行编译)
        run: |
          set -euo pipefail
          VERSION="${{ inputs.mihomo_version }}"
          if [ "$VERSION" = "custom" ]; then
            VERSION="${{ inputs.mihomo_custom_version }}"
          elif [ "$VERSION" = "latest" ]; then
            VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          fi
          [ -n "$VERSION" ] || { echo "错误: mihomo 版本为空"; exit 1; }

          PLATFORM="${{ inputs.mihomo_platform }}"
          if [ "$PLATFORM" = "custom" ]; then
            PLATFORM="${{ inputs.mihomo_custom_platform }}"
          fi
          [ -n "$PLATFORM" ] || { echo "错误: mihomo 平台为空"; exit 1; }

          URL="https://github.com/MetaCubeX/mihomo/releases/download/v${VERSION}/mihomo-linux-${PLATFORM}-v${VERSION}.gz"
          echo "下载: $URL"
          curl -fL --retry 3 -o /tmp/mihomo.gz "$URL"
          mkdir -p "${{ github.workspace }}/files/usr/libexec"
          gzip -dc /tmp/mihomo.gz > "${{ github.workspace }}/files/usr/libexec/mihomo"
          chmod 0755 "${{ github.workspace }}/files/usr/libexec/mihomo"
          mkdir -p "${{ github.workspace }}/files/usr/bin"
          ln -sf /usr/libexec/mihomo "${{ github.workspace }}/files/usr/bin/mihomo"
          file "${{ github.workspace }}/files/usr/libexec/mihomo"
          ls -lah "${{ github.workspace }}/files/usr/libexec/mihomo"

      - name: Check Docker
        run: |
          if [[ "${{ inputs.include_docker }}" == "yes" ]]; then
             echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES docker"' >> shell/apk-custom-packages.sh
             echo "✅ 已为Rockchip平台补充 docker 组件"
          fi
      

      - name: Building Rockchip ImmortalWrt 25.12.x
        run: |
          profile="${{ github.event.inputs.profile }}"
          include_docker="${{ github.event.inputs.include_docker }}"
          enable_pppoe=$(jq -r '.inputs.enable_pppoe // ""' "$GITHUB_EVENT_PATH")
          pppoe_account=$(jq -r '.inputs.pppoe_account // ""' "$GITHUB_EVENT_PATH")
          pppoe_password=$(jq -r '.inputs.pppoe_password // ""' "$GITHUB_EVENT_PATH")
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize }}"
          case "$rootfs_partsize" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          luci_version="${{ github.event.inputs.luci_version }}"
          echo "Building for profile: $profile"
          docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/rockchip/imm25.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/fork-packages:/home/build/immortalwrt/fork-packages" \
              -v "${{ github.workspace }}/rockchip/build25.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e INCLUDE_DOCKER=$include_docker \
              -e INCLUDE_GEOX="${{ inputs.include_geox }}" \
              -e ROOTFS_PARTSIZE=$ROOTFS_SIZE \
              -e ENABLE_PPPOE="$enable_pppoe" \
              -e PPPOE_ACCOUNT="$pppoe_account" \
              -e PPPOE_PASSWORD="$pppoe_password" \
          immortalwrt/imagebuilder:rockchip-armv8-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
        
    
      - name: 生成动态 Release 说明
        run: |
          set -euo pipefail

          PROFILE="${{ github.event.inputs.profile }}"
          case "$PROFILE" in
            friendlyarm_nanopi-r5c) DEV="FriendlyARM NanoPi R5C" ;;
            friendlyarm_nanopi-r5s) DEV="FriendlyARM NanoPi R5S" ;;
            friendlyarm_nanopi-r6c) DEV="FriendlyARM NanoPi R6C" ;;
            friendlyarm_nanopi-r6s) DEV="FriendlyARM NanoPi R6S" ;;
            friendlyarm_nanopi-r2s) DEV="FriendlyARM NanoPi R2S" ;;
            friendlyarm_nanopi-r2c) DEV="FriendlyARM NanoPi R2C" ;;
            friendlyarm_nanopi-r4s) DEV="FriendlyARM NanoPi R4S" ;;
            radxa_e20c) DEV="Radxa E20C" ;;
            *) DEV="$PROFILE" ;;
          esac
          echo "DEV_NAME=$DEV" >> "$GITHUB_ENV"

          MIHOMO_VER="${{ inputs.mihomo_version }}"
          [ "$MIHOMO_VER" = "custom" ] && MIHOMO_VER="${{ inputs.mihomo_custom_version }}"
          MIHOMO_PLAT="${{ inputs.mihomo_platform }}"
          [ "$MIHOMO_PLAT" = "custom" ] && MIHOMO_PLAT="${{ inputs.mihomo_custom_platform }}"

          BODY="${{ github.workspace }}/release-body.md"
          {
            echo "# 🛠️ ImmortalWrt Rockchip 固件"
            echo ""
            echo "**构建仓库**: yanjinbin/ImmortalWrt-ImageBuilder"
            echo "**仓库提交**: ${{ github.sha }} (${{ github.ref_name }})"
            echo "**构建时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## ⚙️ 本次构建参数"
            echo "- ImmortalWrt 版本: ${{ inputs.luci_version }}"
            echo "- 设备: $DEV ($PROFILE)"
            echo "- LAN 管理地址: ${{ inputs.custom_router_ip }}"
            echo "- 登录用户名: root"
            echo "- 登录密码: 666666"
            echo "- 固件空间: ${{ inputs.rootfs_partsize }}"
            echo "- Docker: ${{ inputs.include_docker }}"
            echo "- PPPoE: ${{ inputs.enable_pppoe }}"
            echo "- mihomo: v$MIHOMO_VER ($MIHOMO_PLAT)"
            if [ -n "${{ inputs.remark }}" ]; then
              echo ""
              echo "## 📝 备注"
              echo "${{ inputs.remark }}"
            fi
            echo ""
            echo "## 🧩 已集成插件/主题"
            echo "- 代理: nikki ($NIKKI_VER) @ $NIKKI_COMMIT + luci-app-nikki ($LUCI_NIKKI_VER) + mihomo (MetaCubeX 预编译) (fork 魔改: 批量上传/重载清连接)"
            if [ "${{ inputs.include_geox }}" = "yes" ]; then
              echo "- 代理数据: 内置 geoip.dat / geosite.dat / country.mmdb (构建时原生直连下载)"
            else
              echo "- 代理数据: 未内置 (运行时按需下载)"
            fi
            echo "- 主题: luci-theme-uniwrt @ $UNIWRT_COMMIT / luci-theme-footstrap @ $FOOTSTRAP_COMMIT / luci-theme-openwrt (imm 官方)"
            echo "- 预编译源: nikki ${{ inputs.nikki_version }} / uniwrt ${{ inputs.uniwrt_version }} / footstrap ${{ inputs.footstrap_version }}"
            echo "- 统计: luci-app-statistics (CPU/内存/负载/接口流量/磁盘/CPU+GPU温度)"
            echo "- 监控/扩容: luci-app-bandix / luci-app-bandix-plus / luci-app-partexp"
            echo ""
            echo "## 📦 固件文件"
            ls -lh "${{ github.workspace }}/bin/targets/rockchip/armv8/"*.img.gz 2>/dev/null \
              | awk '{n=$9; sub(/.*\//,"",n); print "- \`"n"\` ("$5")"}'
          } > "$BODY"
          echo "已生成 Release 说明:"
          cat "$BODY"

      - name: 发布固件到独立 Release (每次构建单独页面)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-${{ github.run_id }}-${{ github.run_attempt }}
          name: "ImmortalWrt Rockchip ${{ env.DEV_NAME }} (${{ inputs.luci_version }})"
          body_path: ${{ github.workspace }}/release-body.md
          files: |
            ${{ github.workspace }}/bin/targets/rockchip/armv8/*.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
