name: Build 25.12.x Rockchip
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      profile:
        type: choice
        description: |
          输入 软路由型号 可选值如下：
        options:
          - linkease_easepi-r1
          - 9tripod_x3568-v4
          - ariaboard_photonicat
          - ariaboard_photonicat2
          - armsom_sige3
          - armsom_sige7
          - cyber_cyber3588-aib
          - ezpro_mrkaio-m68s
          - firefly_roc-rk3328-cc
          - firefly_roc-rk3568-pc
          - friendlyarm_nanopc-t4
          - friendlyarm_nanopc-t6
          - friendlyarm_nanopi-r2c
          - friendlyarm_nanopi-r2c-plus
          - friendlyarm_nanopi-r2s
          - friendlyarm_nanopi-r3s
          - friendlyarm_nanopi-r4s
          - friendlyarm_nanopi-r4se
          - friendlyarm_nanopi-r4s-enterprise
          - friendlyarm_nanopi-r5c
          - friendlyarm_nanopi-r5s
          - friendlyarm_nanopi-r6c
          - friendlyarm_nanopi-r6s
          - friendlyarm_nanopi-r76s
          - huake_guangmiao-g4c
          - lunzn_fastrhino-r66s
          - lunzn_fastrhino-r68s
          - lyt_t68m
          - mmbox_anas3035
          - nlnet_xiguapi-v3
          - pine64_rock64
          - pine64_rockpro64
          - radxa_cm3_io
          - radxa_e20c
          - radxa_e25
          - radxa_e52c
          - radxa_rock-2a
          - radxa_rock-2f
          - radxa_rock-3a
          - radxa_rock-3b
          - radxa_rock-3c
          - radxa_rock-4c-plus
          - radxa_rock-4d
          - radxa_rock-4se
          - radxa_rock-5a
          - radxa_rock-5b
          - radxa_rock-5b-plus
          - radxa_rock-5-itx
          - radxa_rock-5c
          - radxa_rock-5t
          - radxa_rock-pi-4a
          - radxa_rock-pi-e
          - radxa_rock-pi-s
          - radxa_zero-3e
          - radxa_zero-3w
          - sinovoip_bpi-r2-pro
          - widora_mangopi-m28c
          - widora_mangopi-m28k
          - xunlong_orangepi-5
          - xunlong_orangepi-5-plus
          - xunlong_orangepi-r1-plus
          - xunlong_orangepi-r1-plus-lts
        required: true
        default: 'friendlyarm_nanopi-r5c'
      custom_router_ip:
        description: "选择默认 LAN 口管理地址(仅对多网口软路由有效)"
        required: true
        type: choice
        default: "192.168.100.1"
        options:
          - "192.168.100.1"
          - "192.168.1.1"
          - "192.168.2.1"
          - "192.168.5.1"
          - "192.168.31.1"
          - "10.0.0.1"
      mihomo_version:
        description: "mihomo 版本 (默认 1.19.28; 选 custom 时填写下方自定义版本)"
        required: true
        type: choice
        default: "1.19.28"
        options:
          - "1.19.28"
          - "latest"
          - "1.19.29"
          - "1.19.27"
          - "1.19.24"
          - "custom"
      mihomo_custom_version:
        description: "自定义 mihomo 版本号 (mihomo_version 选 custom 时填写, 例如 1.19.25)"
        required: false
        default: ""
      mihomo_platform:
        description: "mihomo 平台 (默认 arm64, 覆盖 R5C/R6S/E20C; 选 custom 时填写下方自定义平台)"
        required: true
        type: choice
        default: "arm64"
        options:
          - "arm64"
          - "amd64"
          - "amd64-v3"
          - "amd64-compatible"
          - "armv7"
          - "riscv64"
          - "386"
          - "custom"
      mihomo_custom_platform:
        description: "自定义 mihomo 平台 (选 custom 时填写, 对应 MetaCubeX releases 资产名如 mipsle-softfloat)"
        required: false
        default: ""
      rootfs_partsize:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  # 用 OpenWrt 25.12 SDK (aarch64_generic) 编译本仓库 fork 魔改的插件:
  #   yanjinbin/OpenWrt-nikki        -> nikki + luci-app-nikki + mihomo-meta(预编译, 版本/平台可选)
  #   yanjinbin/uniwrt-luci          -> luci-theme-uniwrt
  #   yanjinbin/luci-theme-footstrap -> luci-theme-footstrap
  # 每次构建都拉取 fork 最新 main 分支, 保证魔改内容进入固件
  build-fork-packages:
    name: 编译 fork 插件 ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nikki
            repository: yanjinbin/OpenWrt-nikki
            feed: nikki
            packages: "mihomo-meta nikki luci-app-nikki"
          - name: uniwrt-luci
            repository: yanjinbin/uniwrt-luci
            feed: uniwrt
            packages: "luci-theme-uniwrt"
          - name: luci-theme-footstrap
            repository: yanjinbin/luci-theme-footstrap
            feed: footstrap
            packages: "luci-theme-footstrap"

    steps:
      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}

      - name: 配置 mihomo 版本与平台 (MetaCubeX 预编译, 不自行编译)
        if: matrix.name == 'nikki'
        run: |
          set -euo pipefail
          VERSION="${{ inputs.mihomo_version }}"
          if [ "$VERSION" = "custom" ]; then
            VERSION="${{ inputs.mihomo_custom_version }}"
          elif [ "$VERSION" = "latest" ]; then
            VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          fi
          [ -n "$VERSION" ] || { echo "错误: mihomo 版本为空"; exit 1; }
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$VERSION/" mihomo-meta/Makefile

          PLATFORM="${{ inputs.mihomo_platform }}"
          if [ "$PLATFORM" = "custom" ]; then
            PLATFORM="${{ inputs.mihomo_custom_platform }}"
          fi
          [ -n "$PLATFORM" ] || { echo "错误: mihomo 平台为空"; exit 1; }
          sed -i "s/^MIHOMO_PLATFORM_OVERRIDE:=.*/MIHOMO_PLATFORM_OVERRIDE:=$PLATFORM/" mihomo-meta/Makefile

          echo "mihomo: version=$VERSION platform=$PLATFORM"
          grep -E "^(PKG_VERSION|MIHOMO_PLATFORM_OVERRIDE):=" mihomo-meta/Makefile

      - name: 用 OpenWrt 25.12 SDK 编译 (aarch64_generic)
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: aarch64_generic-openwrt-25.12
          FEEDNAME: ${{ matrix.feed }}
          PACKAGES: ${{ matrix.packages }}
          INDEX: 1
          NO_REFRESH_CHECK: true
          V: s

      - name: 上传编译产物
        uses: actions/upload-artifact@v7
        with:
          name: fork-${{ matrix.name }}
          path: bin/packages/**/*.apk
          if-no-files-found: error

  build:
    needs: build-fork-packages
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/rockchip/build25.sh
      
      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的Rockchip软路由管理地址是:${{ github.event.inputs.custom_router_ip }}"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip
      
      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Download fork 自编译插件
        uses: actions/download-artifact@v8
        with:
          pattern: fork-*
          path: ${{ github.workspace }}/fork-packages
          merge-multiple: true

      - name: Check Docker
        run: |
          if [[ "${{ inputs.include_docker }}" == "yes" ]]; then
             echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES docker"' >> shell/apk-custom-packages.sh
             echo "✅ 已为Rockchip平台补充 docker 组件"
          fi
      

      - name: Building Rockchip ImmortalWrt 25.12.x
        run: |
          profile="${{ github.event.inputs.profile }}"
          include_docker="${{ github.event.inputs.include_docker }}"
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize }}"
          case "$rootfs_partsize" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          luci_version="${{ github.event.inputs.luci_version }}"
          echo "Building for profile: $profile"
          docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/rockchip/imm25.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/fork-packages:/home/build/immortalwrt/fork-packages" \
              -v "${{ github.workspace }}/rockchip/build25.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e INCLUDE_DOCKER=$include_docker \
              -e ROOTFS_PARTSIZE=$ROOTFS_SIZE \
              -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
              -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
              -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
          immortalwrt/imagebuilder:rockchip-armv8-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
        
    
      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息

          - ✳️ **软路由型号**: ${{ github.event.inputs.profile }}
          - 🏠 **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            extra_content="#### 默认带docker"
            echo -e "\n$extra_content" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

          echo -e "\n#### 已集成插件/主题\n- nikki (代理) + luci-app-nikki\n- luci-theme-uniwrt / luci-theme-footstrap / luci-theme-openwrt\n- luci-app-statistics (流量统计)\n- luci-app-bandix / luci-app-partexp" >> ${{ github.workspace }}/router-info.md

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild
          name: ImmortWrt-Rockchip
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/rockchip/armv8/*.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
